<!DOCTYPE html><html><head><meta charset="utf-8"><title>css</title></head>
<body style="margin:0">
<iframe id="f" src="/atelier" style="width:1440px;height:1200px;border:0"></iframe>
<script>
const f = document.getElementById('f');
f.onload = () => setTimeout(() => {
  try {
    const d = f.contentDocument;
    const btn = [...d.querySelectorAll('button')].find(x => x.textContent.trim() === '文字按钮');
    const cls = btn ? btn.className : '(no btn)';
    const matched = [];
    const walk = (list, sheetOrder) => {
      for (const r of list) {
        if (r.cssRules) { walk([...r.cssRules]); continue; }
        const sel = r.selectorText || '';
        if (sel.includes(':hover') && (sel.includes('text-accent-hover') || sel.includes('text-ink-2'))) {
          matched.push(sel.slice(0, 60) + ' => color:' + (r.style.color || '') + (r.parentRule ? ' [nested]' : ''));
        }
      }
    };
    for (const sheet of d.styleSheets) {
      let rules = []; try { rules = [...sheet.cssRules]; } catch {}
      walk(rules);
    }
    document.title = "CSS=" + JSON.stringify({ hasClass: cls.includes('hover:text-accent-hover'), clsTail: cls.slice(-120), rules: matched.slice(0, 6) });
  } catch (e) { document.title = "ERR " + e.message; }
}, 3800);
</script></body></html>
