name: 发布安装包

# 手动触发，或推送 v* 版本标签时：
# 云端分别构建 macOS（arm64）与 Windows 安装包，并自动创建/更新对应版本的 Release。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 确保 Electron 二进制
        run: node scripts/ensure-electron.mjs

      - name: 构建（standalone）
        run: pnpm build

      - name: 组装桌面服务包
        run: node scripts/prepare-desktop.mjs

      - name: 打包（${{ matrix.target }}）
        run: pnpm exec electron-builder --${{ matrix.target }} --publish never

      - name: 收集产物（改 ASCII 文件名：Actions 产物链路会丢中文）
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          if [ "${{ matrix.target }}" = "mac" ]; then
            cp ../atrium-dist/release/*.dmg "release-assets/atrium-${V}-mac-arm64.dmg"
          else
            cp ../atrium-dist/release/*.exe "release-assets/atrium-${V}-windows-setup.exe"
          fi
          ls -la release-assets/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: atrium-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 核对产物
        run: ls -la release-assets/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: v${{ steps.version.outputs.v }}
          generate_release_notes: true
          files: release-assets/*
