# 中庭 · electron-builder 配置（桌面壳独立目录，不打包业务依赖）
appId: com.atrium.desktop
productName: 中庭

directories:
  app: electron-app
  output: ../atrium-dist/release
  buildResources: build

files:
  - main.js
  - package.json
  - "!**/node_modules/**"

extraResources:
  - from: ../atrium-dist/build/desktop-server.tar.gz
    to: server.tar.gz

asar: true
npmRebuild: false
electronDist: node_modules/electron/dist

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - dmg
